spring:
  application:
    name: gitfix-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gitfix}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        options:
          model: ${LLM_MODEL:qwen2.5-coder:7b}
          temperature: 0.2
      embedding:
        enabled: true
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        table-name: vector_store

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# GitFix Application Specific Properties
gitfix:
  encryption-key: ${ENCRYPTION_KEY:on7pdSJ1mYPADmmNKG4752ZPxq/lI0rEqciKmludMF4=}
  workspace-dir: ${WORKSPACE_DIR:./workspace}
  max-retries: ${MAX_RETRIES:3}
  retrieval-top-k: ${RETRIEVAL_TOP_K:8}
  sandbox-timeout-seconds: ${SANDBOX_TIMEOUT_SECONDS:300}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  trigger-label: ${GITHUB_TRIGGER_LABEL:gitfix}
